name: Refresh news

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_news.py'
      - '.github/workflows/update-news.yml'
  schedule:
    # Every 30 minutes from 08:17 to 23:47 Taiwan time (UTC 00:17–15:47).
    - cron: '17,47 0-15 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dashboard-news
  cancel-in-progress: true

jobs:
  refresh-news:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh Google News RSS
        run: python scripts/update_news.py

      - name: Commit news feed
        run: |
          if git diff --quiet -- site/data/dashboard.json; then
            echo "No news changes"
          else
            git config user.name "stock-dashboard-bot"
            git config user.email "stock-dashboard-bot@users.noreply.github.com"
            git add site/data/dashboard.json
            git commit -m "news: refresh feed"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - name: Deploy refreshed news
        id: deployment
        uses: actions/deploy-pages@v4
