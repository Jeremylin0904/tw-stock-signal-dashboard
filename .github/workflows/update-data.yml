name: Update dashboard data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'config/**'
      - '.github/workflows/update-data.yml'
  schedule:
    # Taiwan 14:40, after market close
    - cron: '40 6 * * 1-5'
    # Taiwan 21:40, after FinMind branch data usually updates
    - cron: '40 13 * * 1-5'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update market / revenue / news / broker data
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          FINMIND_SPONSOR_TOKEN: ${{ secrets.FINMIND_SPONSOR_TOKEN }}
        run: python scripts/update_data.py
      - name: Commit changed data
        run: |
          if git diff --quiet -- site/data/dashboard.json; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "stock-dashboard-bot"
          git config user.email "stock-dashboard-bot@users.noreply.github.com"
          git add site/data/dashboard.json
          git commit -m "data: refresh dashboard"
          git push
