name: Update dashboard data
# Public broker summaries are always refreshed; Sponsor data, when available, upgrades the target to a fuller ledger.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'config/**'
      - '.github/workflows/update-data.yml'
  schedule:
    # Taiwan 14:40, after market close
    - cron: '40 6 * * 1-5'
    # Taiwan 23:10, after public broker summaries normally update
    - cron: '10 15 * * 1-5'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build baseline dashboard
        run: python scripts/seed_dashboard.py

      - name: Update market / revenue / news
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python scripts/update_data.py

      - name: Update public broker summaries
        run: python scripts/update_public_broker.py

      - name: Upgrade 9887 target with Sponsor data when available
        continue-on-error: true
        env:
          FINMIND_SPONSOR_TOKEN: ${{ secrets.FINMIND_SPONSOR_TOKEN }}
        run: python scripts/update_broker_agg.py

      - name: Commit changed data
        run: |
          if git diff --quiet -- site/data/dashboard.json site/data/public_broker_history.json; then
            echo "No data changes"
          else
            git config user.name "stock-dashboard-bot"
            git config user.email "stock-dashboard-bot@users.noreply.github.com"
            git add site/data/dashboard.json site/data/public_broker_history.json
            git commit -m "data: refresh dashboard"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - name: Deploy refreshed dashboard
        id: deployment
        uses: actions/deploy-pages@v4
